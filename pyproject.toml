[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitstore"
version = "1.0.1"
description = "Utilities to encrypt directories with utilitz and exchange them through GitHub repositories."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "artitzco" }
]
dependencies = [
  "utilitz[crypto]>=0.9.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
